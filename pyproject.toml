[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Conversational SIEM Assistant for Investigation and Automated Threat Reporting using NLP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "alembic>=1.14.0,<2.0",
    "asyncpg>=0.30.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "bcrypt>=4.0.0,<6.0",
    "httpx>=0.28.0,<1.0",
    "reportlab>=4.2.0,<5.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
]
llm = [
    "langgraph>=0.2.0,<1.0",
    "langchain-core>=0.3.0,<2.0",
    "langchain-groq>=1.2.0,<2.0",
    "groq>=1.7.0,<2.0",
]
elastic = [
    "elasticsearch[async]>=8.16.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
